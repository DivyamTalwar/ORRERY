name: Tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # keyless signing + provenance via OIDC
      attestations: write # publish build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - name: Full verification gate
        run: bun run ci

      - name: Require tag and package version parity
        run: bun run tag:check -- "$GITHUB_REF_NAME"

      - name: Build flattened immutable artifacts
        run: bun run release

      - name: Generate CycloneDX SBOM
        run: bun run sbom

      - name: Resolve artifact paths
        id: artifacts
        run: |
          set -euo pipefail
          # Refuse to guess if more than one candidate exists: signing the wrong file is
          # worse than failing the release.
          resolve_one() {
            # Without nullglob an unmatched pattern survives literally and would be
            # reported as "found 1", which is a confusing way to fail a release.
            shopt -s nullglob
            local -a matches=( $1 )
            if [ "${#matches[@]}" -ne 1 ] || [ ! -f "${matches[0]}" ]; then
              echo "expected exactly one file matching '$1', found ${#matches[@]}" >&2
              exit 1
            fi
            printf '%s' "${matches[0]}"
          }
          tarball="$(resolve_one 'dist/*.tar.gz')"
          sbom="$(resolve_one 'dist/*.cdx.json')"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"

      # SLSA-style build provenance: proves which workflow, commit, and runner
      # produced this exact byte sequence.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.artifacts.outputs.tarball }}

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.artifacts.outputs.tarball }}
          sbom-path: ${{ steps.artifacts.outputs.sbom }}

      # cosign-installer v3 cannot install Cosign 3.x; v4 is required for it.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.2

      # Keyless signing. The certificate binds the signature to this workflow's OIDC
      # identity and the event is recorded in the Rekor transparency log.
      - name: Sign artifacts
        run: |
          set -euo pipefail
          for file in "${{ steps.artifacts.outputs.tarball }}" "${{ steps.artifacts.outputs.sbom }}"; do
            cosign sign-blob --yes --bundle "${file}.cosign.bundle" "$file"
          done

      - name: Verify signatures before publishing
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          identity="^https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/"
          for file in "${{ steps.artifacts.outputs.tarball }}" "${{ steps.artifacts.outputs.sbom }}"; do
            cosign verify-blob "$file" \
              --bundle "${file}.cosign.bundle" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "$identity"
          done

      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256 \
            dist/*.cdx.json \
            dist/*.cosign.bundle \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
