interface:
  display_name: "Orrery Orchestration"
  short_description: "Route implementation to native Astra / xhigh or Terra / high, or explicitly opt into Luna tasks, then verify and accept"
  default_prompt: "Use $orchestration to select the native implementation lane before delegating - Terra / high for bounded specified work, Astra / xhigh for security, concurrency, algorithms, migrations, or a wide blast radius - then obtain the fresh Sol review; use the user-visible Luna task lane only when I explicitly authorize it, then use list_projects, list_threads, create_thread, wait_threads, read_thread, and send_message_to_thread to monitor, review, correct, and accept the task yourself."
